# Databricks configuration file
# This file contains example configurations for different environments

# Development Environment
[dev]
cluster_id = "dev-cluster-id"
workspace_url = "https://your-workspace.cloud.databricks.com"
input_path = "/FileStore/shared_uploads/dev/input"
output_path = "/FileStore/shared_uploads/dev/output"
num_records = 100

# Staging Environment  
[staging]
cluster_id = "staging-cluster-id"
workspace_url = "https://your-workspace.cloud.databricks.com"
input_path = "/mnt/staging/input"
output_path = "/mnt/staging/output"
num_records = 1000

# Production Environment
[prod]
cluster_id = "prod-cluster-id"
workspace_url = "https://your-workspace.cloud.databricks.com"
input_path = "/mnt/prod/input"
output_path = "/mnt/prod/output"
num_records = 10000

# Job Parameters
[job_config]
# Timeout in seconds
timeout_seconds = 3600
# Max retries on failure
max_retries = 3
# Email notifications
email_on_failure = ["admin@company.com"]
email_on_success = ["team@company.com"]

# Cluster Configuration
[cluster_config]
# Databricks Runtime Version
databricks_runtime_version = "11.3.x-scala2.12"
# Node type for driver
driver_node_type = "i3.xlarge"
# Node type for workers
worker_node_type = "i3.xlarge"
# Number of worker nodes
num_workers = 2
# Auto-scaling configuration
min_workers = 1
max_workers = 4
auto_scale = true

# Library Dependencies
[libraries]
# Python packages to install on cluster
pypi_packages = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scipy>=1.9.0"
]

# Maven coordinates for JVM libraries
maven_coordinates = []

# JAR files to install
jar_libraries = []